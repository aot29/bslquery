[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bslquery"
version = "0.1.0"
description = "Python package for querying the biosoundslab database"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }  # or your actual license
authors = [
    { name = "Alvaro Ortiz Troncoso", email = "a.ortiztroncoso@mfn.berlin" },
]
dependencies = [
    "psycopg2-binary>=2.9",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "pdoc>=15",
]
notebooks = [
    "jupyter",
    "matplotlib",
]

[project.urls]
Repository = "https://github.com/MfN-Berlin/bslquery"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bslquery.queries" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=bslquery --cov-report=term-missing"